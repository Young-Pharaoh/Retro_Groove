services:
  postgres:
    image: postgres:16
    container_name: retrogroove-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retrogroove}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypass123}
      POSTGRES_DB: ${POSTGRES_DB:-retrogroove}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
